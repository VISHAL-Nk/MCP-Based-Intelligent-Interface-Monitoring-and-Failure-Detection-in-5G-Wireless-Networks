apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  namespace: open5gs
  labels:
    app: netshoot
spec:
  hostNetwork: true
  containers:
  - name: netshoot
    image: nicolaka/netshoot:v0.11
    securityContext:
      privileged: true
    command: ["/bin/bash", "-c", "sleep infinity"]
    resources:
      limits:
        cpu: 200m
        memory: 200Mi
      requests:
        cpu: 50m
        memory: 50Mi
