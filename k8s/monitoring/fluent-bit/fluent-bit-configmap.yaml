apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_open5gs_*.log
        Parser            cri
        DB                /var/log/fluent-bit-open5gs.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On

    [FILTER]
        Name    lua
        Match   kube.*
        call    strip_ansi_color_code
        code    function strip_ansi_color_code(tag, timestamp, record) if type(record["log"]) == "string" then record["log"] = record["log"]:gsub('[\27\155][][()#;?%d]*[A-PRZcf-ntqry=><~]', '') return 2, timestamp, record end return 0, timestamp, record end

    [FILTER]
        Name         parser
        Match        kube.*
        Key_Name     log
        Parser       open5gs
        Reserve_Data True

    [FILTER]
        Name         parser
        Match        kube.*
        Key_Name     log
        Parser       ueransim
        Reserve_Data True

    [OUTPUT]
        Name   stdout
        Match  *

    [OUTPUT]
        Name   file
        Match  kube.*
        Path   /var/log/open5gs-monitoring
        File   open5gs-parsed.log
        Format plain

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   Yes

    [PARSER]
        Name        open5gs
        Format      regex
        Regex       ^(?<log_time>\d{2}\/\d{2} \d{2}:\d{2}:\d{2}\.\d{3}): \[(?<module>[^\]]+)\] (?<level>[A-Z]+): (?<message>.*?)(?: \((?<source>[^\)]+)\))?$

    [PARSER]
        Name        ueransim
        Format      regex
        Regex       ^\[(?<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\] \[(?<module>[^\]]+)\] \[(?<level>[^\]]+)\] (?<message>.*)$
